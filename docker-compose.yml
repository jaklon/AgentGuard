name: agentguard

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENT_ALLOWED_ORIGINS: ${AGENT_ALLOWED_ORIGINS:-https://localhost}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-30}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-16384}
      BOTCHAIN_TESTNET_RPC_URL: ${BOTCHAIN_TESTNET_RPC_URL:-https://rpc.bohr.life}
      BOTCHAIN_TESTNET_CHAIN_ID: ${BOTCHAIN_TESTNET_CHAIN_ID:-968}
      BOTCHAIN_TESTNET_EXPLORER_URL: ${BOTCHAIN_TESTNET_EXPLORER_URL:-https://scan.bohr.life}
      BOTCHAIN_CONTRACT_ADDRESS: ${BOTCHAIN_CONTRACT_ADDRESS:-}
      DATABASE_URL: sqlite:////data/agentguard.db
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-15}
    volumes:
      - agentguard_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: infrastructure/Caddy.Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_BOTCHAIN_RPC_URL: ${VITE_BOTCHAIN_RPC_URL:-https://rpc.bohr.life}
        VITE_BOTCHAIN_CHAIN_ID: ${VITE_BOTCHAIN_CHAIN_ID:-968}
        VITE_BOTCHAIN_EXPLORER_URL: ${VITE_BOTCHAIN_EXPLORER_URL:-https://scan.bohr.life}
        VITE_BOTCHAIN_CONTRACT_ADDRESS: ${VITE_BOTCHAIN_CONTRACT_ADDRESS:-}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  agentguard_data:
  caddy_data:
  caddy_config:
