name: agentguard

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENT_ALLOWED_ORIGINS: ${AGENT_ALLOWED_ORIGINS:-https://agentguard.my.id}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-30}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-16384}
      BOTCHAIN_TESTNET_RPC_URL: ${BOTCHAIN_TESTNET_RPC_URL:-https://rpc.bohr.life}
      BOTCHAIN_TESTNET_CHAIN_ID: ${BOTCHAIN_TESTNET_CHAIN_ID:-968}
      BOTCHAIN_TESTNET_EXPLORER_URL: ${BOTCHAIN_TESTNET_EXPLORER_URL:-https://scan.bohr.life}
      BOTCHAIN_CONTRACT_ADDRESS: ${BOTCHAIN_CONTRACT_ADDRESS:-}
      BOTCHAIN_ALLOCATION_WALLET: ${BOTCHAIN_ALLOCATION_WALLET:-0x1905B29C6F01eDe290010DB081A6ad0Ba78A1a91}
      DATABASE_URL: sqlite:////data/agentguard.db
      AI_PROVIDER: ${AI_PROVIDER:-llama_cpp}
      AI_MODEL: ${AI_MODEL:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://llm:8080}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
    volumes:
      - agentguard_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "-m"
      - "/models/${LOCAL_LLM_MODEL_FILE:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${LOCAL_LLM_CONTEXT_SIZE:-4096}"
      - "--threads"
      - "${LOCAL_LLM_THREADS:-3}"
      - "--parallel"
      - "1"
      - "--jinja"
    volumes:
      - ./models:/models:ro
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: infrastructure/Caddy.Dockerfile
    environment:
      DOMAIN: ${DOMAIN:-agentguard.my.id}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  agentguard_data:
  caddy_data:
  caddy_config:
