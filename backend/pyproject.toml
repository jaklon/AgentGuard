[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agentguard-api"
version = "0.1.0"
description = "FastAPI service for AgentGuard"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "eth-abi==5.2.0",
  "eth-hash[pycryptodome]==0.7.1",
  "eth-utils==5.3.0",
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
